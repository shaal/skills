<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallgrass Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Karla:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0a08;
    --ink: #f2e9d8;
    --ink-dim: rgba(242, 233, 216, 0.62);
    --ink-faint: rgba(242, 233, 216, 0.34);
    --glass: rgba(14, 12, 10, 0.42);
    --line: rgba(242, 233, 216, 0.14);
    --sun: #f0aa5c;
    --dusk: #8ea6dc;
    --focus: #ffd18f;
    --display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --ui: Karla, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); font: 14px/1.4 var(--ui); -webkit-font-smoothing: antialiased; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }
  .ui { transition: opacity .5s ease; }
  body.hide-ui .ui { opacity: 0; pointer-events: none; }

  .brand { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .brand h1 { margin: 0; font: italic 600 clamp(34px, 5vw, 46px)/0.9 var(--display); letter-spacing: 0.01em; }
  .brand p { margin: 6px 0 0; font: 400 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }

  .keys { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 5px; justify-items: end;
    font: 500 12px/1.2 var(--ui); color: var(--ink-dim); text-shadow: 0 1px 10px rgba(0,0,0,.5); pointer-events: none; }
  .keys kbd { font: 500 10.5px/1 var(--mono); letter-spacing: .04em; color: var(--ink); border: 1px solid var(--line); background: rgba(14,12,10,.28);
    border-radius: 5px; padding: 3px 5px; margin-right: 6px; }

  .deck { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 32px));
    box-sizing: border-box; padding: 14px 16px 12px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--glass); backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15);
    display: grid; gap: 10px; }
  .readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .clock { font: 500 26px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .phase { font: italic 600 20px/1 var(--display); color: var(--sun); transition: color .6s; }
  .phase.cool { color: var(--dusk); }
  .stat { font: 400 11.5px/1 var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 500; color: var(--ink-faint); letter-spacing: .08em; margin-right: 3px; text-transform: uppercase; font-size: 10px; }
  .readout .spacer { flex: 1; }

  .scrub { position: relative; height: 58px; }
  .scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scrub input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .scrub input:focus-visible + .ring { opacity: 1; }
  .scrub .ring { position: absolute; inset: -4px; border-radius: 8px; border: 1px solid var(--focus); opacity: 0; pointer-events: none; }

  .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .ctl { display: grid; gap: 4px; flex: 1 1 130px; min-width: 0; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .ctl span { display: flex; justify-content: space-between; }
  .ctl em { font-style: normal; color: var(--ink-dim); letter-spacing: .02em; text-transform: none; font-size: 11px; font-variant-numeric: tabular-nums; }
  input[type=range].slim { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range].slim::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--ink-dim) var(--p, 40%), var(--line) var(--p, 40%)); border-radius: 2px; }
  input[type=range].slim::-moz-range-track { height: 2px; background: var(--line); }
  input[type=range].slim::-moz-range-progress { height: 2px; background: var(--ink-dim); }
  input[type=range].slim::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
  input[type=range].slim::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; }
  input[type=range].slim:focus-visible { outline: 1px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns button, .float-btn { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim);
    background: rgba(242,233,216,.04); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .btns button:hover, .float-btn:hover { color: var(--ink); border-color: rgba(242,233,216,.3); }
  .btns button[aria-pressed="true"] { color: #1a130b; background: var(--ink); border-color: var(--ink); }
  button:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }

  .float-btn { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #walkBtn { padding: 16px 18px; font-size: 12px; bottom: calc(210px + env(safe-area-inset-bottom, 0px)); user-select: none; -webkit-user-select: none; touch-action: none; }
  #walkBtn.on { color: #1a130b; background: var(--ink); }
  #showUi { opacity: .75; }

  #veil { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 90% at 30% 110%, #3a2412 0%, #120d09 55%, #0b0a08 100%); z-index: 10; transition: opacity 1.2s ease; }
  #veil.gone { opacity: 0; pointer-events: none; }
  .veil-inner { display: grid; gap: 12px; justify-items: center; padding: 0 24px; text-align: center; }
  .veil-title { font: italic 600 54px/1 var(--display); }
  .veil-sub { font: 400 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); min-height: 1.4em; }
  .veil-bar { width: 180px; height: 1px; background: var(--line); overflow: hidden; }
  .veil-bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .3s ease; }
  .veil-err { max-width: 46ch; font: 400 13px/1.5 var(--ui); color: var(--ink-dim); }

  @media (max-width: 640px) {
    .keys { display: none; }
    .deck { padding: 12px 12px 10px; gap: 8px; }
    .clock { font-size: 22px; }
    .phase { font-size: 18px; }
    .scrub { height: 50px; }
  }
  @media (pointer: fine) { #walkBtn { display: none; } }
  @media (prefers-reduced-motion: reduce) { .ui, #veil { transition: none; } }
</style>

<canvas id="gl" aria-label="Real-time 3D meadow. Drag to look around, use W A S D to walk."></canvas>

<div id="veil">
  <div class="veil-inner">
    <div class="veil-title">Tallgrass</div>
    <div class="veil-sub" id="veilMsg">Raising the hills</div>
    <div class="veil-bar"><i id="veilBar"></i></div>
  </div>
</div>

<header class="brand ui">
  <h1>Tallgrass</h1>
  <p>47.0° N · 21 June · rendered live</p>
</header>

<aside class="keys ui" aria-label="Controls">
  <div><kbd>Drag</kbd>look around</div>
  <div><kbd>W A S D</kbd>walk <kbd style="margin-left:6px">Shift</kbd>run</div>
  <div><kbd>Scroll</kbd>crouch or rise</div>
  <div><kbd>Hover</kbd>brush the grass</div>
  <div><kbd>H</kbd>hide interface</div>
</aside>

<section class="deck ui" aria-label="Scene controls">
  <div class="readout">
    <span class="clock" id="clock">19:10</span>
    <span class="phase" id="phase">Golden hour</span>
    <span class="spacer"></span>
    <span class="stat"><b>Sun</b><span id="sunEl">+6.0°</span></span>
    <span class="stat"><b>Eye</b><span id="eyeV">1.3 m</span></span>
  </div>
  <div class="scrub">
    <canvas id="scrubCv" aria-hidden="true"></canvas>
    <input id="time" type="range" min="900" max="1410" step="1" value="1150" aria-label="Time of day, local solar time">
    <div class="ring"></div>
  </div>
  <div class="row">
    <label class="ctl" for="wind"><span>Wind <em id="windV">16 km/h</em></span><input class="slim" id="wind" type="range" min="0" max="45" value="16"></label>
    <label class="ctl" for="cloud"><span>Cloud <em id="cloudV">30%</em></span><input class="slim" id="cloud" type="range" min="0" max="100" value="30"></label>
    <div class="btns">
      <button id="play" aria-pressed="false" title="Run time forward">Timelapse</button>
      <button id="drift" aria-pressed="true" title="Slow cinematic walk">Drift</button>
      <button id="sound" aria-pressed="false" title="Wind and crickets">Sound</button>
      <button id="hide" title="Hide interface (H)">Hide</button>
    </div>
  </div>
</section>
<button id="walkBtn" class="float-btn ui">Hold to walk</button>
<button id="showUi" class="float-btn" hidden>Show controls</button>

  const wd = U.uWindDir.value; U.uCloudOffset.value.x += wd.x * dt * (2 + S.wind * 0.6) * 0.00021; U.uCloudOffset.value.y += wd.y * dt * (2 + S.wind * 0.6) * 0.00021;
  const speed = updateCamera(dt, now);
  S.exposure += ((S.exposureTarget || 1) - S.exposure) * Math.min(1, dt * 2.5);
  sky.position.copy(camera.position); sky.scale.setScalar(30000); sky.updateMatrixWorld();
  camera.updateMatrixWorld();
  updateTreeShadow(false);
  updateTrample(dt, speed);

  renderer.setRenderTarget(sceneRT); renderer.clear(); renderer.render(scene, camera);

  // god rays from the sun disc, occluded by grass and hills
  const sd = skyU.uSunDir.value;
  sunScreen.copy(sd).multiplyScalar(1000).add(camera.position).project(camera);
  const facing = new THREE.Vector3(); camera.getWorldDirection(facing);
  const inFront = facing.dot(sd);
  const raysK = S.keyIsSun ? smooth(0.1, 0.55, inFront) * smooth(-0.02, 0.02, S.sunEl) * (0.35 + 0.65 * smooth(0.5, 0.02, S.sunEl)) : 0;
  if (raysK > 0.001) {
    const su = new THREE.Vector2(sunScreen.x * 0.5 + 0.5, sunScreen.y * 0.5 + 0.5);
    rayMaskMat.uniforms.uSun.value.copy(su); rayBlurMat.uniforms.uSun.value.copy(su);
    renderer.setRenderTarget(rayA); fsq.material = rayMaskMat; fsq.render(renderer);
    rayBlurMat.uniforms.tIn.value = rayA.texture; rayBlurMat.uniforms.uStep.value = 1.0; renderer.setRenderTarget(rayB); fsq.material = rayBlurMat; fsq.render(renderer);
    rayBlurMat.uniforms.tIn.value = rayB.texture; rayBlurMat.uniforms.uStep.value = 0.32; renderer.setRenderTarget(rayA); fsq.render(renderer);
    compMat.uniforms.tRays.value = rayA.texture;
  }
  compMat.uniforms.uRays.value = raysK * 0.4;
  compMat.uniforms.uExposure.value = S.exposure;
  renderer.setRenderTarget(hdrRT); fsq.material = compMat; fsq.render(renderer);
  bloom.render(renderer, null, hdrRT, dt, false);
  finalMat.uniforms.uTime.value = T; finalMat.uniforms.uNight.value = S.night;
  renderer.setRenderTarget(null); fsq.material = finalMat; fsq.render(renderer);

  uiTimer += dt; if (uiTimer > 0.1) { uiTimer = 0; updateUi(); }
  updateAudio(T, speed);
  adapt(dt);
  requestAnimationFrame(render);
}

/* pick a spot on a gentle rise with an open view down toward the low sun */
function findSpawn(az) {
  const dx = Math.sin(az - 0.15), dz = -Math.cos(az - 0.15); let best = null, bestScore = -1e9;
  for (let x = -360; x <= 360; x += 20) for (let z = -360; z <= 360; z += 20) {
    if (Math.hypot(x, z) > 360) continue;
    const h0 = heightAt(x, z) + 1.4; let maxA = -1;
    for (let d = 25; d < 700; d += 12) maxA = Math.max(maxA, (heightAt(x + dx * d, z + dz * d) - h0) / d);
    const slope = Math.abs(heightAt(x + 3, z) - heightAt(x - 3, z)) + Math.abs(heightAt(x, z + 3) - heightAt(x, z - 3));
    const score = -Math.max(maxA, -0.06) - slope * 0.02 - Math.hypot(x, z) * 0.00004;
    if (score > bestScore) { bestScore = score; best = { x, z }; }
  }
  return best;
}

/* ---------------------------------------------------------------- boot */
(async () => {
  try {
    applyWind(); applyCloud();
    await buildWorld();
    // start on the knoll, facing the low sun a little off-axis
    const { az } = solar(S.minutes);
    cam.x = spawn.x; cam.z = spawn.z;
    cam.yaw = az - 0.3; cam.y = heightAt(cam.x, cam.z) + S.eye;
    resize();
    updateLighting(); lightDirty = false;
    await progress('Waiting for the light', 0.96);
    updateCamera(0, performance.now());
    renderer.compile(scene, camera);
    updateUi(); drawScrub();
    requestAnimationFrame((t) => { last = t; render(t); });
    setTimeout(() => $('veil').classList.add('gone'), 450);
    window.__meadow = { S, cam, grass, trees, U, heightAt, horizonAt, solar, camera, setTime: (m) => { S.minutes = m; timeIn.value = m; lightDirty = true; drawScrub(); }, renderer };
  } catch (e) {
    console.error(e);
    veilMsg.textContent = 'The scene could not start: ' + (e && e.message ? e.message : e);
  }
})();
</script>
