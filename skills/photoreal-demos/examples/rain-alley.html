<style>

}

  const cx = camera.position.x, cz = camera.position.z;
  const sorted = lights.map((l) => ({ l, d: (l.x - cx) ** 2 + (l.z - cz) ** 2 * 0.6 })).sort((a, b) => a.d - b.d);
  const neon = U.uNeon.value;

/* ------------------------------------------------------------ sound: rain hiss, drips, a far-off train */
let audio = null;
function startAudio() {

  const hiss = ctx.createBiquadFilter(); hiss.type = 'bandpass'; hiss.frequency.value = 5200; hiss.Q.value = 0.4;
  const hissG = ctx.createGain(); src.connect(hiss).connect(hissG).connect(master);
  const low = ctx.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 380;
  const lowG = ctx.createGain(); src.connect(low).connect(lowG).connect(master);
  src.start(); master.gain.setTargetAtTime(0.8, ctx.currentTime, 0.6);

    o.frequency.setValueAtTime(900 + Math.random() * 1600, t); o.frequency.exponentialRampToValueAtTime(300 + Math.random() * 200, t + 0.06);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.02 + Math.random() * 0.03, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);

}
$('sound').addEventListener('click', () => {

  else { audio.on = !audio.on; audio.master.gain.setTargetAtTime(audio.on ? 0.8 : 0, audio.ctx.currentTime, 0.3); if (audio.on) { audio.ctx.resume(); } }

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, isTouch ? 1.6 : 1.4);
  W = Math.round(innerWidth * dpr * scale); H = Math.round(innerHeight * dpr * scale);
  renderer.setSize(W, H, false);
  sceneRT.setSize(W, H); hdrRT.setSize(W, H); scatterRT.setSize(W >> 1, H >> 1); reflRT.setSize(W >> 1, H >> 1);
  bloom.setSize(W, H);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  finalMat.uniforms.uRes.value.set(W, H); groundMat.uniforms.uRes.value.set(W, H);
}
addEventListener('resize', resize);
const perf = { acc: 0, n: 0, cool: 2 };
function adapt(dt) {
  perf.acc += dt; perf.n++; if (perf.acc < 1) return;
  const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0; if (perf.cool-- > 0) return;
  const ns = avg > 1 / 40 ? Math.max(0.55, scale - 0.1) : avg < 1 / 75 ? Math.min(1, scale + 0.05) : scale;
  if (ns !== scale) { scale = ns; resize(); perf.cool = 2; }
}
let last = performance.now(), T = 0, uiT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  U.uTime.value = T;
  updateCamera(dt, T);
  camera.updateMatrixWorld();
  sky.position.copy(camera.position); sky.scale.setScalar(400); sky.updateMatrixWorld();
  updateLights(T);
  const fogK = 0.006 + S.haze * 0.03; U.uFogK.value = fogK;
  updateReflection();
  renderer.setRenderTarget(sceneRT); renderer.clear(); renderer.render(scene, camera);
  scatterMat.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse); scatterMat.uniforms.uInvView.value.copy(camera.matrixWorld);
  scatterMat.uniforms.uCam.value.copy(camera.position); scatterMat.uniforms.uSigma.value = 0.002 + S.haze * 0.014 + S.rain * 0.004;
  renderer.setRenderTarget(scatterRT); fsq.material = scatterMat; fsq.render(renderer);
  compMat.uniforms.uExposure.value = 1.2;
  renderer.setRenderTarget(hdrRT); fsq.material = compMat; fsq.render(renderer);
  bloom.render(renderer, null, hdrRT, dt, false);
  renderer.setRenderTarget(null); fsq.material = finalMat; fsq.render(renderer);
  uiT += dt; if (uiT > 0.25) { uiT = 0; $('pos').textContent = `${Math.max(0, Math.round(4 - cam.z))} m down the alley`; }
  adapt(dt);
  requestAnimationFrame(frame);
}

(async () => {
  try {
    $('veilMsg').textContent = 'Painting the signs';
    try { await Promise.race([Promise.all([document.fonts.load('64px "Dela Gothic One"', TATE.join('') + YOKO.join('')), document.fonts.load('64px "Yuji Syuku"', '焼鳥酒祭おでん大衆酒場縁一杯味')]), new Promise((r) => setTimeout(r, 4000))]); } catch (e) {}
    atlasTex = buildAtlas(); worldMat.uniforms.uAtlas.value = atlasTex;
    $('veilMsg').textContent = 'Stringing the cables';
    await new Promise((r) => setTimeout(r, 0));
    buildAlley();
    applyRain(); applyHaze(); applyNeon();
    resize();
    renderer.compile(scene, camera);
    requestAnimationFrame((t) => { last = t; frame(t); });
    setTimeout(() => $('veil').classList.add('gone'), 400);
    const now = new Date(); $('stamp').textContent = `01:${String(now.getMinutes()).padStart(2, '0')} · 14 °C · humidity 97%`;
    window.__alley = { S, cam, lights, U, renderer, scatterMat, compMat, bloom, finalMat };
  } catch (e) { console.error(e); $('veilMsg').textContent = 'The scene could not start: ' + e.message; }
})();
</script>
